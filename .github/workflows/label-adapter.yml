name: Label Adapter from Issue Form

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Apply adapter label based on form selection
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            // Find the adapter section in the form body.
            // GitHub renders multi-select dropdown values as comma-separated text
            // under the section heading.
            const match = body.match(/### Which database adapter are you using\?\n\n([^\n#]+)/);
            if (!match) return;

            const selected = match[1]
              .split(',')
              .map(s => s.trim().toLowerCase())
              .filter(Boolean);

            const validAdapters = ['snowflake', 'databricks', 'bigquery', 'postgres', 'redshift'];
            const labels = selected.filter(s => validAdapters.includes(s));

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }

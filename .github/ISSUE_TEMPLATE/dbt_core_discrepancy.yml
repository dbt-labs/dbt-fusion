name: 🔄 dbt Core 1.x ↔ v2 discrepancy
description: Report behavior that works in dbt Core 1.x but differs or fails in dbt Core v2 (the Fusion engine)
title: "[Discrepancy] <title>"
labels: ["bug", "triage", "discrepancy"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template if you've found behavior that **works in dbt Core 1.x but doesn't work (or works differently) in dbt Core v2 (the Fusion engine)**.

        For bugs unrelated to v1/v2 compatibility, use the "🐞 Bug (dbt Core v2 / Fusion engine)" template instead.
  - type: checkboxes
    attributes:
      label: Before you submit
      options:
        - label: I have confirmed this behavior works correctly in dbt Core 1.x
          required: true
        - label: I have searched the existing issues and could not find a duplicate
          required: true
  - type: textarea
    attributes:
      label: Describe the discrepancy
      description: What does dbt Core 1.x do, and what does dbt Core v2 do instead?
      placeholder: |
        In dbt Core 1.x: ...
        In dbt Core v2 (Fusion engine): ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: |
        A minimal model, macro, or project snippet that shows the discrepancy.
      placeholder: |
        ```sql
        -- models/my_model.sql
        ...
        ```
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Error messages or log output from dbt Core v2 (and optionally dbt Core 1.x for comparison).
      render: shell
    validations:
      required: false
  - type: textarea
    attributes:
      label: Environment
      value: |
        - OS:
        - dbt Core 1.x version:
        - dbt Core v2 (Fusion engine) version: (`dbt --version`)
        - Adapter + version:
      render: markdown
    validations:
      required: false
  - type: dropdown
    id: adapter
    attributes:
      label: Which database adapter are you using?
      multiple: true
      options:
        - snowflake
        - databricks
        - bigquery
        - postgres
        - redshift
        - other (describe in Additional Context)
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Context
      description: Links, references, or anything else that will help us reproduce and fix this.
    validations:
      required: false
